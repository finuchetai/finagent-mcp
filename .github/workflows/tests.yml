name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python preflight.py environment
      - run: python -m pip install '.[files,postgres,remote,sheets,local]'
      - run: python -m finance_mcp.diagnostics environment --packages
      - run: python -m finance_mcp.diagnostics stdio --timeout 15
      - run: python -m unittest discover -s tests -v
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
