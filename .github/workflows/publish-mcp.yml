name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already available on PyPI
        required: true
        type: string
      publish:
        description: Publish the validated server metadata to the official MCP Registry
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check published package and ownership marker
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json, os, tomllib, urllib.request
          from pathlib import Path
          server = json.loads(Path('server.json').read_text())
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          version = os.environ['EXPECTED_VERSION']
          assert server['version'] == project['version'] == version
          package = server['packages'][0]
          assert package['version'] == version and package['identifier'] == project['name']
          assert package['registryType'] == 'pypi'
          url = f"https://pypi.org/pypi/{project['name']}/{version}/json"
          with urllib.request.urlopen(url, timeout=30) as response:
              published = json.load(response)
          assert f"mcp-name: {server['name']}" in published['info']['description']
          assert published['urls'] and not any(file['yanked'] for file in published['urls'])
          print('Published package and MCP ownership marker verified')
          PY
      - name: Install signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify official publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --retry 3 --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --retry 3 --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          printf '%s  %s\n' '4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8' "$archive" | sha256sum --check
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher validate server.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-mcp-metadata
          path: |
            server.json
            mcp-publisher
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-mcp-metadata
      - run: chmod +x mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
