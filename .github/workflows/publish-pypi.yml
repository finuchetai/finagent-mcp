name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version from pyproject.toml
        required: true
        type: string
      publish:
        description: Upload the verified distributions to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          actual = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if actual != os.environ['EXPECTED_VERSION']:
              raise SystemExit('Requested version does not match pyproject.toml')
          PY
      - run: python preflight.py environment
      - run: python -m pip install '.[files,postgres,remote,sheets,local]' build twine
      - run: python -m finance_mcp.diagnostics environment --packages
      - run: python -m finance_mcp.diagnostics stdio --timeout 15
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/open-finance-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
