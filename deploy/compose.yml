services:
  finance-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:18040:8000"
    env_file: remote.env
    volumes:
      - ${FINANCE_EXPORT_DIR:?Set an approved export directory}:/data:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m,noexec,nosuid]
    restart: unless-stopped
