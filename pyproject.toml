[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-finance-mcp"
version = "0.7.0rc2"
description = "Read-only financial reports for AI assistants: demo, Excel/CSV, PostgreSQL and Google Sheets"
keywords = ["mcp", "mcp-server", "finance", "financial-analysis", "excel", "csv", "postgresql"]
requires-python = ">=3.11"
dependencies = ["mcp==2.2.0"]
readme = "README.en.md"
authors = [{name = "Самойлова Татьяна"}]
license = {file = "LICENSE"}

[project.optional-dependencies]
local = ["tomlkit>=0.13,<1"]
remote = ["PyJWT[crypto]>=2.10,<3", "uvicorn>=0.31"]
sheets = ["google-auth[requests]>=2.38,<3", "google-auth-oauthlib>=1.2,<2", "keyring>=25,<26"]
files = ["openpyxl==3.1.5"]
postgres = ["psycopg[binary]==3.3.4"]

[project.scripts]
open-finance-mcp = "finance_mcp.server:main"
finance-mcp-google = "finance_mcp.google_oauth:main"
finance-mcp-connect = "finance_mcp.google_connect:main"
finance-mcp-setup = "finance_mcp.local_setup:main"
finance-mcp-doctor = "finance_mcp.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://finuchetai.ru/?utm_source=github&utm_medium=opensource&utm_campaign=finance_mcp"
Repository = "https://github.com/finuchetai/finagent-mcp"

[tool.setuptools.package-data]
finance_mcp = ["resources/*.md", "resources/*.svg", "resources/google-oauth-client.json"]
